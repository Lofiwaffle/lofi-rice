bind = SUPER ALT, P, exec, scrcpy # Launch scrcpy

# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above
# ========================================
# CANONICAL KEYBINDINGS - Centralized here

# Clear defaults to avoid double-launch
unbind = SUPER, Return
unbind = SUPER, E
unbind = SUPER, W
unbind = SUPER, D
unbind = SUPER, N
# ========================================
# NOTE: Terminal keybinds (SUPER+Return and SUPER+Shift+Return) are ONLY defined here.
# Do NOT redefine them in hyprland/keybinds.conf or custom/keybinds.conf to avoid duplicates.
# This file is sourced AFTER those files, making it the final source of truth.

# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# CANONICAL TERMINAL KEYBINDS - Define here only (no duplicates in other .conf files)
bind = SUPER, Return, exec, ghostty
bind = SUPER SHIFT, Return, exec, /home/lofi/.local/bin/waveterm
bindd = SUPER, B, Browser (New Window), exec, vivaldi --new-window
bindd = SUPER ALT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, M, Moonlight, exec, uwsm app -- moonlight
bindd = SUPER, N, Notion, exec, vivaldi --app=\"https://notion.so/\"
bindd = SUPER ALT, N, NotebookLM, exec, vivaldi --app=\"https://notebooklm.google.com/\"
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Discord, exec, /usr/sbin/discord
bindd = SUPER SHIFT, G, Gmail, exec, vivaldi --app="https://mail.google.com/"
bindd = SUPER, O, Obsidian, exec, /usr/bin/obsidian
bindd = SUPER, P, Perplexity, exec, vivaldi --app="https://www.perplexity.ai/"

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, vivaldi --app="https://chatgpt.com/"
bindd = SUPER ALT, A, Numbat, exec, vivaldi --app="http://numbat:8080"
bindd = SUPER SHIFT ALT, A, Google Gemini, exec, vivaldi --app="https://gemini.google.com/"
bindd = SUPER SHIFT, C, Visual Studio Code, exec, uwsm app -- code
bindd = SUPER SHIFT ALT, C, Cursor, exec, uwsm app -- cursor
bindd = SUPER, E, File manager, exec, dolphin
bindd = SUPER, Y, YouTube, exec, vivaldi --app="https://youtube.com/"
bindd = SUPER SHIFT ALT, G, Google Calendar, exec, vivaldi --app="https://calendar.google.com/"
bindd = SUPER, G, Gmail & Calendar, exec, vivaldi --app="https://mail.google.com/" & vivaldi --app="https://calendar.google.com/"
bindd = SUPER, U, Unifi, exec, vivaldi --app="https://unifi.ui.com/"
bindd = SUPER, R, Reddit, exec, vivaldi --app="https://www.reddit.com/"

# Window management
bind = SUPER, Q, killactive,
unbind = SUPER SHIFT, W
bind = SUPER SHIFT, J, togglesplit,
bind = SUPER SHIFT, V, togglefloating,
bind = SHIFT, F11, fullscreen,

# Launcher
bindd = SUPER, Space, Launcher, exec, bash -c "vicinae toggle"

# Hyprscrolling bindings


# === Hyprscrolling bindings ===
# hyprscrolling grow the window width by 5%
unbind = SUPER SHIFT, code:21
bind = SUPER SHIFT, code:21, layoutmsg, colresize +0.05
# hyprscrolling shrink the window width by 5%
unbind = SUPER SHIFT, code:20
bind = SUPER SHIFT, code:20, layoutmsg, colresize -0.05
# hyprscrolling cycle window width with preset conf
bind = SUPER SHIFT, R, layoutmsg, colresize +conf
# move to the right column
bind = SUPER SHIFT, L, layoutmsg, move +col
# move to the left column
bind = SUPER SHIFT, H, layoutmsg, move -col
bind = SUPER SHIFT ALT, up, layoutmsg, movewindowto u
bind = SUPER SHIFT ALT, down, layoutmsg, movewindowto d

bind = SUPER SHIFT ALT, right, layoutmsg, movewindowto r
bind = SUPER SHIFT ALT, left, layoutmsg, movewindowto l
bind = SUPER SHIFT, minus, layoutmsg, colresize -conf
bind = SUPER SHIFT, equal, layoutmsg, colresize +conf

unbind = SUPER SHIFT, F
bind = SUPER SHIFT, F, fullscreen
