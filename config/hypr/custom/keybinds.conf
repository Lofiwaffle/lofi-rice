# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bindd = Ctrl+Super, Slash, Edit shell config, exec, xdg-open ~/.config/illogical-impulse/config.json
bindd = Ctrl+Super+Alt, Slash, Edit extra keybinds, exec, xdg-open ~/.config/hypr/custom/keybinds.conf

# Add your custom keybinds here
# All default keybinds are already loaded from hyprland/keybinds.conf
# Only add bindings that are unique to your setup or override defaults
#
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above
# Lines ending with `# [hidden]` won't be shown on cheatsheet

# Example custom app bindings:
# bindd = Super, W, Browser, exec, firefox
# bindd = Super+Shift, D, Discord, exec, discord

bindd = Super+Shift, Return, Warp Terminal, exec, warp-terminal

#!
##! Custom Apps
bindd = Super+Shift+Alt, C, Cursor, exec, uwsm app -- cursor
bindd = Super+Shift+Alt, M, Moonlight, exec, uwsm app -- moonlight
bindd = Super+Shift, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = Super+Alt, X, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = Super+Shift+Alt, A, Google Gemini, exec, omarchy-launch-webapp "https://gemini.google.com"
bindd = Super+Shift, N, NotebookLM, exec, omarchy-launch-webapp "https://notebooklm.google.com/"
bindd = Super+Shift+Alt, G, Google Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/"
bindd = Super, U, Unifi, exec, omarchy-launch-webapp "https://unifi.ui.com/"
bindd = Super, R, Reddit, exec, omarchy-launch-webapp "https://www.reddit.com/"
bindd = Super+Alt, T, Activity Monitor, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "kitty -1 btop" "kitty -1 htop"
bindd = Super+Shift, D, Discord, exec, uwsm app -- discord
bindd = Super+Shift, G, Gmail, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = Super+Alt, G, Google Messages, exec, omarchy-launch-webapp "https://messages.google.com/web/conversations"
bindd = Super, O, Obsidian, exec, uwsm app -- obsidian --enable-wayland-ime