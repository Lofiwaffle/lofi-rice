# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# Performance settings
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = genie, 0.68, -0.55, 0.27, 1.55
    animation = windowsOut, 1, 0.5, genie, popin 80%
}

general {
    layout = dwindle
}
